# 发版工作流：push v* tag 时自动构建并发布 Release
#
# 用法：
#   git tag v0.1.1
#   git push origin v0.1.1
# → GitHub Actions 自动构建 zip 并挂到 Releases 页面
#
# 也可在 Actions 页面手动触发（workflow_dispatch，可填版本号覆盖）

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.1.1；留空则从 Cargo.toml 读取）"
        required: false

permissions:
  contents: write # 允许创建 Release 和上传产物

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}") {
            $v = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref_name }}" -like "v*") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $cargo = Get-Content "app/Cargo.toml" -Raw
            $v = [regex]::Match($cargo, '(?m)^\s*version\s*=\s*"([^"]+)"').Groups[1].Value
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version = $v"

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $stage = "package/SkillLink-v$env:VERSION"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/skill-link.exe" $stage
          Copy-Item "package/使用说明.txt" $stage
          Compress-Archive -Path $stage -DestinationPath "SkillLink-v$env:VERSION-win64.zip"
          Write-Host "Built SkillLink-v$env:VERSION-win64.zip"

      - name: Run tests
        run: cargo test --release -p skill-link-core

      - name: Upload to Release (tag push)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: SkillLink-v*-win64.zip
          generate_release_notes: true

      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SkillLink-v${{ steps.version.outputs.version }}-win64.zip
          path: SkillLink-v*-win64.zip
